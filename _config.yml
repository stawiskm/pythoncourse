# GitHub Pages Configuration
title: "Python Course - Interactive Learning Hub"
description: "Comprehensive Python course with video tutorials, interactive exercises, and hands-on assignments"

# GitHub Pages uses kramdown by default
markdown: kramdown
highlighter: rouge

# Theme for GitHub Pages (using built-in theme)
theme: minima

# Exclude files from processing
exclude:
  - README.md
  - LICENSE
  - .gitignore

# Site settings
author: "Python Course Team"

# Kramdown options for better markdown rendering
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge